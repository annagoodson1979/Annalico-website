<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seal and Stamp Notary</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: #000; 
            color: #fff; 
            line-height: 1.6; 
        }
        
        .navbar { 
            background: #000; 
            color: #fff; 
            padding: 15px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .logo { 
            font-size: 2em; 
            color: #d4af37;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        .logo:hover {
            transform: scale(1.05);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #d4af37;
            transition: width 0.3s;
        }
        .nav-links a:hover {
            color: #d4af37;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .dropdown {
            position: relative;
        }
        .dropdown-btn {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 8px 15px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            white-space: nowrap;
        }
        .dropdown-btn:hover {
            background: #d4af37;
            color: #000;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: #111;
            min-width: 320px;
            border: 1px solid #333;
            z-index: 1000;
            margin-top: 5px;
        }
        .dropdown-content.show {
            display: block;
        }
        .dropdown-content a {
            color: #fff;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            font-size: 10px;
            white-space: nowrap;
            border-bottom: 1px solid #222;
        }
        .dropdown-content a:hover {
            background: #222;
            color: #d4af37;
        }

            background: #000; 
            color: #fff; 
            padding: 150px 20px 100px; 
            text-align: center; 
        }
