<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Studio 21&trade;</title>
    <link rel="stylesheet" href="styles.css?v=20260819a" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Studio 21&trade;</a>
      <button class="menu-toggle" type="button">Menu</button>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="salon.html">Studio 21&trade; | Salon</a>
        <a href="notary/">Studio 21&trade; | Notary</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="page-card">
        <h1 class="gold-heading">Contact</h1>
        <p>
          Choose the studio you need and send a quick message.
        </p>

        <div class="contact-choice-grid">
          <section class="contact-choice-card">
            <h2>Studio 21&trade; Salon</h2>
            <form class="mini-message-form" data-mailto-form data-email="anna@astudio21.com" data-subject="Studio 21 Salon Message">
              <label for="salonMessage">Message</label>
              <textarea id="salonMessage" name="message" placeholder="How can Studio 21 Salon help?"></textarea>
              <button type="submit">Send Message</button>
            </form>
            <a class="button-link contact-studio-link" href="salon.html">Studio 21&trade; Salon</a>
          </section>

          <section class="contact-choice-card">
            <img class="contact-logo" src="images/nlogo.jpg" alt="Studio 21 Notary logo" />
            <h2>Studio 21&trade; Notary</h2>
            <form class="mini-message-form" data-mailto-form data-email="anna@astudio21.com" data-subject="Studio 21 Notary Message">
              <label for="notaryMessage">Message</label>
              <textarea id="notaryMessage" name="message" placeholder="How can Studio 21 Notary help?"></textarea>
              <button type="submit">Send Message</button>
            </form>
            <a class="button-link secondary contact-studio-link" href="notary/">Studio 21&trade; Notary</a>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <span>A Brand of Duyen An LLC</span>
        <span class="footer-sep">|</span>
        <span>(972) 900-7147</span>
        <span class="footer-sep">|</span>
        <span>anna@astudio21.com</span>
        <span class="footer-sep">|</span>
        <span>&copy; 2026</span>
      </p>
    </footer>

    <script src="script.js?v=20260819a"></script>
  </body>
</html>
